behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # PPO + LSTM continue from run42 checkpoint (1M).
    # Total effective training = 1M (run42) + 1M (run43) = 2M
    # Test hypothesis: LSTM learning monotonic in run42 (first10 1.65 -> tail50 2.41).
    # If reward > 2.7 at end of run43 -> LSTM continues to improve, beats RND (2.49).
    # If plateau ~2.4-2.5 -> LSTM converged, ngang RND.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
