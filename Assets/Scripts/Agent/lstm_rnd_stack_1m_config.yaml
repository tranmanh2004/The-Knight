behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      rnd:                       # Random Network Distillation, Burda 2018
        strength: 0.01           # match run36
        gamma: 0.99
        encoding_size: 256
        learning_rate: 1.0e-4
    # PPO + LSTM + RND stack — combine best architecture (LSTM) + best intrinsic (RND).
    # Mirror run36 (RND scratch 1M) + memory block; or mirror run42 (LSTM clean 1M) + RND block.
    # Hypothesis: cong huong → vuot 2.5 ceiling cua run36/run42/run43.
    # Output mong doi:
    #   run44 > 2.6 -> stack co loi
    #   run44 ~ 2.5 -> redundant, nothing to add over single best
    #   run44 < 2.4 -> conflict, RND noise pha LSTM hoi tu
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
