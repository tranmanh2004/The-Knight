behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # NO curiosity block. Coverage la code-only (EpisodicCoverageReward = 0.005f trong CombatAgent.cs).
    # Ablation tach Coverage khoi ICM redundancy:
    #   run35 = PPO + ICM only         (curiosity)
    #   run38 = PPO + ICM + Coverage   (ca 2)
    #   run40 = PPO + Coverage only    (file nay)
    # Neu run40 > run38 -> Coverage hurt KHI co ICM (redundancy confirmed).
    # Neu run40 < run35 -> Coverage one alone yeu hon ICM novelty signal.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
