behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
      memory:
        sequence_length: 64    # match time_horizon
        memory_size: 256       # LSTM hidden state size (must be even)
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # PPO + LSTM Memory (NO curiosity, NO RND, NO Coverage)
    # Test architecture-only effect:
    #   run34 = PPO no memory       = 2.07 (baseline)
    #   run41 = PPO + LSTM memory   = ? (file nay)
    # Neu run41 > run34 +20% -> Memory cai thien.
    # Neu run41 > run35 (ICM 2.42) -> Memory thay the duoc ICM.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
