behaviors:
  AttentionAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      rnd: # Random Network Distillation — Burda et al. 2018
        strength: 0.01      # match ICM strength de fair vs run35
        gamma: 0.99
        encoding_size: 256  # match ICM encoding size
        learning_rate: 1.0e-4  # ml-agents default for RND
    # RND scratch 1M — mirror run35 (ICM scratch 1M) de test hypothesis
    # "ICM degenerate thanh RND tren env nay" (encoding collapse, inverse loss flat).
    # 2x3 ablation matrix sau khi co run36:
    #   PPO tran   scratch 1M   = run34
    #   PPO+ICM    scratch 1M   = run35
    #   PPO+RND    scratch 1M   = run36 (file nay)
    #   PPO+ICM    init25  3.5M = run33
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
