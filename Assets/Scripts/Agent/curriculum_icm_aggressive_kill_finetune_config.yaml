behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 2.0e-5
      beta: 5.0e-4
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.001
        gamma: 0.99
        encoding_size: 256
        learning_rate: 2.0e-4
    # run58: fine-tune from run57 after aggressive seek learned navigation.
    #
    # Goal:
    #   Convert path-following into kills. CombatAgent now gates seek direction
    #   reward behind real BFS progress and penalizes "near target + weapon ready
    #   + no attack", while attack-aligned and ready-attack rewards are stronger.
    #
    # Trainer-side:
    #   Lower LR to avoid destroying run57 navigation.
    #   Lower beta to let the policy become more decisive.
    #   Curiosity is almost off so it does not compete with combat/kill rewards.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000

environment_parameters:
  difficulty:
    curriculum:
      - name: HardRandom
        value: 3
  aggressive_seek:
    curriculum:
      - name: Enabled
        value: 1
