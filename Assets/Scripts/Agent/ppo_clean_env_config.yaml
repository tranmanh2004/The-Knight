behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-5
      beta: 0.004
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 2
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # NO curiosity, NO coverage — clean PPO baseline tren env da fix (run31_fix_plan Lop 1+2+3).
    # Hyperparam khop icm_config.yaml (tru curiosity) de fair compare vs run33.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000
