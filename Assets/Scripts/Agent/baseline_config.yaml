behaviors:
  CombatAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # NO curiosity, NO episodic coverage (EpisodicCoverageReward is code-only in CombatAgent)
    # Curriculum Run: PPO baseline with two enemies, fixed map/weapon, LOS spawn, and soft cooldown attack guard.
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 100000
