behaviors:
  AttentionAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity: # ICM — Pathak et al. 2017
        strength: 0.02
        gamma: 0.99
        encoding_size: 256
        learning_rate: 1.0e-3
    # NO episodic coverage (set EpisodicCoverageReward=0 in Inspector)
    # Ablation Run 2: PPO + ICM — replicates paper's proposed method
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 10000
