behaviors:
  AttentionAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01 # entropy bonus — encourages exploration across 5 actions
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true # important for 321-dim observations with varying scales
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity: # intrinsic motivation to explore new states
        strength: 0.02
        gamma: 0.99
        encoding_size: 64
        learning_rate: 3.0e-4
    max_steps: 3000
    time_horizon: 64
    summary_freq: 1000
    keep_checkpoints: 3
    checkpoint_interval: 10000
