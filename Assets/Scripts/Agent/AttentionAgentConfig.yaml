behaviors:
  AttentionAgentConfig:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01 # entropy bonus — encourages exploration across 5 actions
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: true # important for 321-dim observations with varying scales
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity: # ICM — Pathak et al. 2017
        strength: 0.02 # η: intrinsic reward scale (tune between 0.01–0.05)
        gamma: 0.99
        encoding_size: 256 # increased from 64 — paper uses 288 for similar input size
        learning_rate: 1.0e-3 # paper uses 1e-3, ICM models need to learn faster than policy
    max_steps: 300000 # needs millions of steps to learn — 30000 was only ~15 episodes
    time_horizon: 64
    summary_freq: 10000 # increased — 1000 was too frequent for 3M steps
    keep_checkpoints: 5
    checkpoint_interval: 10000
